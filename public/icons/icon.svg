<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Joining Palms">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#27428c"/>
      <stop offset="55%" stop-color="#0e1a45"/>
      <stop offset="100%" stop-color="#060a1c"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7fa8f2"/>
      <stop offset="70%" stop-color="#b6d7ff"/>
      <stop offset="100%" stop-color="#d9ecff"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="spark" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- bright halo where the magic gathers -->
  <ellipse cx="256" cy="300" rx="180" ry="150" fill="#8db8ff" opacity="0.22" filter="url(#soft)"/>

  <!-- praying-hands silhouette, glowing light blue -->
  <g id="hands" fill="url(#hand)">
    <path d="M 256 452
      C 228 454, 198 448, 174 432
      C 142 412, 118 384, 112 350
      C 107 320, 118 290, 136 268
      C 144 256, 150 244, 152 232
      C 152 212, 168 198, 184 200
      C 192 182, 208 170, 222 174
      C 232 154, 250 144, 264 144
      C 270 144, 274 148, 274 154
      C 282 152, 288 160, 288 174
      C 300 170, 314 182, 322 198
      C 336 196, 350 210, 350 226
      C 352 240, 360 252, 370 264
      C 386 288, 394 316, 390 348
      C 384 380, 362 410, 330 430
      C 306 446, 278 452, 256 452
      Z"/>
  </g>

  <!-- soft outer glow around the hands -->
  <use href="#hands" filter="url(#soft)" opacity="0.9"/>

  <!-- seam where the two palms meet -->
  <path d="M 256 148 C 254 178, 254 208, 258 240" stroke="#1e3a7d" stroke-width="4" fill="none" opacity="0.85"/>
  <!-- thumb notch at the bottom -->
  <path d="M 248 452 C 252 442, 260 442, 264 452" stroke="#1e3a7d" stroke-width="4" fill="none" opacity="0.8"/>

  <!-- magic: rising motes -->
  <g fill="#eaf4ff">
    <circle cx="200" cy="116" r="5"/>
    <circle cx="256" cy="82" r="6"/>
    <circle cx="318" cy="108" r="4.5"/>
    <circle cx="230" cy="150" r="3.2"/>
    <circle cx="292" cy="134" r="3.8"/>
    <circle cx="180" cy="178" r="2.8"/>
    <circle cx="340" cy="166" r="3.2"/>
    <circle cx="272" cy="104" r="2.4"/>
    <circle cx="352" cy="230" r="2.6"/>
    <circle cx="162" cy="238" r="2.6"/>
    <circle cx="216" cy="200" r="2.2"/>
    <circle cx="300" cy="192" r="2.2"/>
  </g>

  <!-- sparkles bursting from the hands -->
  <g fill="#ffffff" filter="url(#spark)">
    <path d="M 256 92 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 Z"/>
    <path d="M 204 146 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <path d="M 308 142 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <circle cx="236" cy="120" r="2.6"/>
    <circle cx="284" cy="124" r="2.4"/>
  </g>
</svg>
