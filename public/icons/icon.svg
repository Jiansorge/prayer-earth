<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Joining Palms">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#27428c"/>
      <stop offset="55%" stop-color="#0e1a45"/>
      <stop offset="100%" stop-color="#060a1c"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7fa8f2"/>
      <stop offset="70%" stop-color="#b6d7ff"/>
      <stop offset="100%" stop-color="#d9ecff"/>
    </linearGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="spark" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="300" rx="180" ry="150" fill="#8db8ff" opacity="0.22" filter="url(#soft)"/>

  <!-- left hand (slender palm + 4 tapered fingers + thumb); mirrored for the right -->
  <g id="handL" fill="url(#hand)">
    <!-- palm, lean and gently curved -->
    <path d="M 158 300 C 158 274, 172 260, 190 260 C 208 260, 222 274, 224 300 C 225 342, 224 386, 222 418 C 221 432, 214 438, 190 438 C 166 438, 159 432, 158 418 C 157 380, 158 342, 158 300 Z"/>
    <!-- little finger, slender and tapered -->
    <path d="M 152 300 C 152 258, 156 226, 162 213 C 166 206, 174 208, 177 215 C 178 228, 178 246, 177 300 Z"/>
    <!-- ring finger -->
    <path d="M 176 300 C 176 252, 181 214, 188 201 C 193 194, 201 197, 204 205 C 205 220, 205 240, 204 300 Z"/>
    <!-- middle finger -->
    <path d="M 199 300 C 199 248, 205 204, 212 190 C 217 183, 225 186, 228 194 C 229 210, 229 232, 228 300 Z"/>
    <!-- index finger (innermost), reaching highest -->
    <path d="M 220 300 C 220 252, 225 206, 232 191 C 237 184, 245 187, 248 195 C 249 210, 249 230, 248 300 Z"/>
    <!-- thumb rising toward the centre, slim and curved -->
    <path d="M 198 448 C 193 448, 189 440, 191 426 C 195 398, 207 376, 223 368 C 233 363, 240 367, 242 377 C 243 390, 241 412, 239 432 C 238 441, 233 448, 226 448 Z"/>
  </g>
  <use href="#handL" transform="translate(512 0) scale(-1 1)"/>

  <!-- soft outer glow around both hands -->
  <use href="#handL" filter="url(#soft)" opacity="0.9"/>
  <use href="#handL" filter="url(#soft)" opacity="0.9" transform="translate(512 0) scale(-1 1)"/>

  <!-- magic: rising motes -->
  <g fill="#eaf4ff">
    <circle cx="200" cy="116" r="5"/>
    <circle cx="256" cy="82" r="6"/>
    <circle cx="318" cy="108" r="4.5"/>
    <circle cx="230" cy="150" r="3.2"/>
    <circle cx="292" cy="134" r="3.8"/>
    <circle cx="180" cy="178" r="2.8"/>
    <circle cx="340" cy="166" r="3.2"/>
    <circle cx="272" cy="104" r="2.4"/>
    <circle cx="352" cy="230" r="2.6"/>
    <circle cx="162" cy="238" r="2.6"/>
    <circle cx="216" cy="200" r="2.2"/>
    <circle cx="300" cy="192" r="2.2"/>
  </g>

  <!-- sparkles bursting from the hands -->
  <g fill="#ffffff" filter="url(#spark)">
    <path d="M 256 92 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 Z"/>
    <path d="M 204 146 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <path d="M 308 142 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <circle cx="236" cy="120" r="2.6"/>
    <circle cx="284" cy="124" r="2.4"/>
  </g>
</svg>
