<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Joining Palms">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#27428c"/>
      <stop offset="55%" stop-color="#0e1a45"/>
      <stop offset="100%" stop-color="#060a1c"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9cc4ff"/>
      <stop offset="60%" stop-color="#cfe4ff"/>
      <stop offset="100%" stop-color="#f2f9ff"/>
    </linearGradient>
    <radialGradient id="pressed" cx="50%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dcebff"/>
      <stop offset="100%" stop-color="rgba(220,235,255,0)"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="spark" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <ellipse cx="256" cy="300" rx="190" ry="158" fill="#9cc4ff" opacity="0.3" filter="url(#soft)"/>

  <!-- left hand: four thin pointed fingers + thumb + palm, pressed toward the centre -->
  <g id="handL" fill="url(#hand)">
    <path d="M 148 344 C 146 382, 148 420, 152 442 C 155 452, 166 458, 178 456 C 192 454, 224 454, 240 456 C 247 456, 249 450, 249 440 C 247 418, 246 378, 244 344 C 230 340, 162 340, 148 344 Z"/>
    <path d="M 150 342 C 143 300, 146 260, 156 240 C 162 229, 171 233, 173 243 C 175 263, 173 302, 172 342 Z"/>
    <path d="M 170 342 C 163 294, 169 250, 179 228 C 185 217, 194 221, 196 231 C 198 251, 196 296, 195 342 Z"/>
    <path d="M 190 342 C 185 288, 192 240, 202 218 C 208 207, 217 211, 219 221 C 221 243, 219 292, 218 342 Z"/>
    <path d="M 210 342 C 207 286, 214 232, 224 208 C 230 197, 239 201, 241 211 C 243 233, 240 286, 239 342 Z"/>
    <path d="M 146 368 C 140 388, 140 408, 147 424 C 153 435, 163 434, 165 422 C 167 406, 165 386, 161 372 C 158 362, 150 360, 146 368 Z"/>
  </g>
  <use href="#handL" transform="translate(512 0) scale(-1 1)"/>

  <!-- bright light where the two palms meet (the pressed centre) -->
  <ellipse cx="256" cy="360" rx="22" ry="86" fill="url(#pressed)" opacity="0.85"/>
  <ellipse cx="256" cy="470" rx="16" ry="26" fill="#eaf4ff" opacity="0.5" filter="url(#soft)"/>

  <!-- soft outer glow around both hands -->
  <use href="#handL" filter="url(#soft)" opacity="0.95"/>
  <use href="#handL" filter="url(#soft)" opacity="0.9" transform="translate(512 0) scale(-1 1)"/>

  <!-- magic: rising motes -->
  <g fill="#eaf4ff">
    <circle cx="200" cy="116" r="5"/>
    <circle cx="256" cy="82" r="6"/>
    <circle cx="318" cy="108" r="4.5"/>
    <circle cx="230" cy="150" r="3.2"/>
    <circle cx="292" cy="134" r="3.8"/>
    <circle cx="180" cy="178" r="2.8"/>
    <circle cx="340" cy="166" r="3.2"/>
    <circle cx="272" cy="104" r="2.4"/>
    <circle cx="352" cy="230" r="2.6"/>
    <circle cx="162" cy="238" r="2.6"/>
    <circle cx="216" cy="200" r="2.2"/>
    <circle cx="300" cy="192" r="2.2"/>
    <circle cx="246" cy="240" r="2.0"/>
    <circle cx="270" cy="236" r="1.8"/>
    <circle cx="196" cy="262" r="1.8"/>
    <circle cx="322" cy="254" r="1.8"/>
  </g>

  <!-- sparkles bursting from the hands -->
  <g fill="#ffffff" filter="url(#spark)">
    <path d="M 256 92 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 Z"/>
    <path d="M 204 146 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <path d="M 308 142 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <path d="M 238 250 l 2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z"/>
    <path d="M 274 244 l 2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z"/>
    <circle cx="236" cy="120" r="2.6"/>
    <circle cx="284" cy="124" r="2.4"/>
    <circle cx="208" cy="206" r="2.2"/>
    <circle cx="304" cy="200" r="2.2"/>
  </g>
</svg>
