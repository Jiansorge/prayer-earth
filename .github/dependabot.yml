version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    # Let a release sit before we're even offered it: catches fresh 0-days
    # and bad/yanked releases in the first days. Security-triggered updates
    # bypass this (applies-to: version-updates), so CVE fixes stay fast.
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
      applies-to: version-updates
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    ignore:
      - dependency-name: "@capacitor/*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "react"
        update-types: [version-update:semver-major]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    cooldown:
      default-days: 7
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
      applies-to: version-updates
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)