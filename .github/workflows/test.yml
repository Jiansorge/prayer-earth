name: test

on:
  push:
    branches: [main]
  pull_request:
  # Run the whole suite on demand, without inventing a commit. Handy when you
  # need to re-verify after changing a runner or a secret rather than the app.
  # It does NOT deploy: deploy-dispatch is guarded on `push`, so a manual run
  # can go green without shipping anything.
  workflow_dispatch:

# Serialize runs per branch rather than letting them overlap.
#
# Two pushes in quick succession used to run at once, and both could reach
# deploy-dispatch. Each sends its own dispatch to sync-engine, and those are
# processed independently - so the older commit's deploy could land after the
# newer one's and quietly put production back on the previous commit. A red
# or green tick would still be true, just about a deployment that is no longer
# the newest.
#
# Queuing rather than cancelling is deliberate. cancel-in-progress would free
# the runner, but a run cancelled inside deploy-dispatch has already handed its
# commit to sync-engine, which carries on regardless - so it would not stop the
# race, only hide it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Shape of this file, and why.
#
# The wall-clock cost of this workflow is almost entirely the browser suites.
# They used to be sequential steps in one job: 356 seconds of browser time
# inside a 413 second job, while twenty static audits finished in 13 and the
# build finished in 4. Running them one after another bought nothing - each
# suite drives its own Chromium against its own copy of dist/ and shares no
# state with the others - so they are now a matrix, and the slowest suite alone
# sets the duration. That, plus caching the Chromium download, is what makes
# this file fast.
#
# `deploy-dispatch` is what turns a green run into a production deploy, so
# every job that gates it must be named in its `needs`.

jobs:
  # Build + the static audits. No browser, so no Chromium install.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build (+ inline CSS)
        run: npm run build
      - name: Built-asset audit (CSP / SW CORE / CSS inlined)
        run: node scripts/audit-build.mjs
      - name: Server integration tests
        run: node scripts/test-server.mjs
      - name: Unit + i18n-placeholder guards
        run: node scripts/test-units.mjs
      # Edge cases executed against the real modules rather than pattern-matched
      # out of the source. A static sweep found 34 candidates and zero real
      # defects; calling the functions with the bad values found a genuine one
      # immediately.
      - name: Edge-case suite
        run: node scripts/test-edge-cases.mjs
      - name: i18n audit
        run: node scripts/audit-i18n.mjs
      # These two catch what a per-value audit cannot. A duplicate key is silent
      # in a JS object literal - the last one wins - and cross-script
      # contamination is a correct-looking sentence in the wrong language.
      - name: i18n duplicate-key audit
        run: node scripts/audit-i18n-dupes.mjs
      - name: i18n cross-script audit
        run: node scripts/audit-i18n-scripts.mjs
      - name: i18n deep audit
        run: node scripts/audit-i18n-deep.mjs
      - name: i18n quality audit (untranslated values)
        run: node scripts/audit-i18n-quality.mjs
      # Second review round: placeholder order, whitespace, repeated function
      # words, and the staleness check for English strings edited recently.
      - name: i18n pass-2 audit
        run: node scripts/audit-i18n-pass2.mjs
      - name: i18n stale-translation audit
        run: node scripts/audit-i18n-stale.mjs
      - name: Prayer language/translation audit
        run: node scripts/audit-prayers.mjs
      # The translated prayer text itself was the only source file no suite named.
      # It is an object literal keyed by English, so it carries the same
      # duplicate-key risk that shipped a mojibake string in zh.js.
      - name: Prayer phrase-translation audit
        run: node scripts/audit-prayer-l10n.mjs
      # The Thirty-Five Buddhas confession ships as our own English rendering so
      # the app carries no modern translation under someone else's copyright.
      # This is what proves that claim rather than asserting it: it compares our
      # prose against the published rendering it replaced and fails if any
      # passage tracks it beyond a fixed liturgical formula. It caught a
      # 23-word shared run when the first attempt turned out to be a paraphrase.
      - name: Sutra rendering is independent
        run: node scripts/audit-sutra-independence.mjs
      # The prayers with no pre-rendered recording depend on the browser or the
      # timed chant. The engine has no /api/tts, so this chain is the only thing
      # making them audible. The audit computes the count rather than naming it.
      - name: Audio fallback chain audit
        run: node scripts/audit-audio-fallback.mjs
      # The file that goes to the Play Console, and the locale strings behind it.
      # Catches repeated-word machine-translation stutters, Play's field limits,
      # untranslated placeholder words, and rows identical to English.
      #
      # Generated first, because dist-store/ is gitignored and a clean checkout
      # has no CSV. The audit reported it missing and failed on every push from
      # Oct 9 until this step existed - which meant the whole `test` job was red
      # and the deploy that depends on it never ran.
      - name: Generate the Play listing CSV
        run: npm run build:play-translations
      - name: Play listing and translation review
        run: node scripts/audit-play-translations.mjs
      # The store listing counted every id in a spirit file, including the
      # spirit's own, so the public figure was 19 too high in all fifteen
      # languages. These assert the count against the data, not against itself.
      - name: Prayer counts are true everywhere they are stated
        run: node scripts/audit-counts.mjs
      # Whether CI and `npm run test:all` still run the same checks. A step added
      # to one and not the other is a check that only ever runs on one machine,
      # which is how CI sat red for three days on a thing nobody ran locally.
      #
      # It reads every job in this file, so moving the browser suites into a
      # matrix below does not hide them from it.
      - name: Local suite and CI run the same checks
        run: node scripts/audit-test-parity.mjs
      # The share/delete/report URLs are a public and a compliance surface and
      # had no coverage. The report route pointed at a path with no page behind
      # it, which served the app shell with a 200.
      - name: Canonical and public URLs
        run: node scripts/test-canonical-urls.mjs

  # The suites that drive a real Chromium. Each is independent - it builds its
  # own dist/ and launches its own browser - so they are a matrix rather than a
  # sequence, and wall-clock time is their maximum rather than their sum.
  #
  # test-resource-lifecycle used to hold all four Earth scenarios in one job at
  # ~232s, which alone set how long a deploy took to start. They now share
  # scripts/lib/lifecycle.mjs and split by concern, so the slowest of them
  # replaces what was a quarter of a minute-counting wait: mount/unmount, the
  # two WebGL failure paths, the two frame-loop paths, and the loading overlay.
  # The split is worth doing past the first one, because the cost of a browser
  # suite is dominated by its own test time rather than its setup - so halving
  # a suite's work halves its wall clock instead of being eaten by overhead.
  #
  # `fail-fast: false` matters for diagnosis. With the default, the first suite
  # to fail cancels the rest, so a red run tells you about one problem when
  # there may be three. Here every suite reports, and a red run is a complete
  # answer rather than the first one.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test-resource-lifecycle
          - test-resource-webgl
          - test-resource-motion
          - test-resource-loading
          - test-audio-fallback-runtime
          - test-a11y
          - test-settings-ui
          - test-main-thread
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      # The Chromium download is ~130MB and was costing ~22s on every job that
      # installed it - seven jobs across this file. It is restored from cache
      # keyed on the lockfile, so the install only really downloads on the first
      # run after Playwright changes version.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install headless Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Build (+ inline CSS)
        run: npm run build
      # One step name for every suite in the matrix: a fixed name like "Resource
      # lifecycle" would label the a11y and settings jobs with the wrong
      # description, which is a small lie in exactly the place you look when
      # something is red.
      #
      # The tail of each suite carries its pass count and wall-clock seconds, so
      # it is also copied into the job summary. Without this the only place a
      # suite's duration exists is inside a log file nobody opens on a green run,
      # which is exactly when a suite quietly getting slower goes unnoticed.
      - name: ${{ matrix.suite }}
        run: |
          set -o pipefail
          node scripts/${{ matrix.suite }}.mjs 2>&1 | tee "$RUNNER_TEMP/suite.log"
      - name: Suite summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          {
            echo "### ${SUITE}"
            echo ""
            echo '```'
            tail -n 25 "$RUNNER_TEMP/suite.log" 2>/dev/null || echo "no output captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install headless Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Real-usage browser suite (CDP, live app + sync server)
        run: node scripts/test-usage-ci.mjs
      - name: Backup / restore tests (no prayer data lost)
        run: node scripts/test-backup.mjs

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --legacy-peer-deps
      - run: npm run build:capacitor
      - run: node scripts/audit-build.mjs
      - run: npx cap sync android
      - run: npm run test:android:assets
      - run: chmod +x android/gradlew && ./android/gradlew -p android assembleDebug
      # Re-run the asset audit now that Gradle has produced a merged manifest, so
      # the shipped-permission checks actually execute instead of skipping.
      - run: npm run test:android:assets
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      # Build a PREVIOUS-version APK (versionCode - 1) so android-smoke can run
      # a genuine old->new upgrade (install v23, seed data, install v24, assert
      # the data survived) instead of only a same-version reinstall. The
      # current APK is already captured in the app-debug artifact above, so
      # rebuilding here with a lower versionCode is safe.
      - name: Build previous-version APK for upgrade test
        run: |
          VC=$(grep -E 'versionCode' android/app/build.gradle | grep -oE '[0-9]+' | head -1)
          sed -i "s/versionCode $VC/versionCode $((VC-1))/" android/app/build.gradle
          chmod +x android/gradlew && ./android/gradlew -p android assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/old.apk"
          echo "built old.apk versionCode=$((VC-1)) (current=$VC)"
      - uses: actions/upload-artifact@v4
        with:
          name: app-old
          path: ${{ runner.temp }}/old.apk

  android-smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci --legacy-peer-deps
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug
      - uses: actions/download-artifact@v4
        with:
          name: app-old
          path: android/app/build/outputs/apk/debug
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator action fetches its own system image once, and a corrupt
      # download surfaces as "Error on ZipFile unknown archive" with the
      # emulator never booting. That is Google's CDN failing, not the app, and
      # it was the cause of a red run on c17c014 where every test passed.
      #
      # Cached rather than only retried. Retrying survives a bad fetch but still
      # pays for the download on every run - ~65 seconds of it, by the timings
      # in this file. On a cache hit the install step is skipped entirely, so
      # the image is fetched once and never again until the API level changes.
      - name: Cache emulator system image
        id: sysimg-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/default/x86_64
          key: android-sysimg-35-default-x86_64
      # Where it does have to download, a partial download is removed between
      # attempts - leaving it in place is what makes the next attempt fail the
      # same way.
      - name: Install emulator system image (retried)
        if: steps.sysimg-cache.outputs.cache-hit != 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          SPEC='system-images;android-35;default;x86_64'
          for attempt in 1 2 3; do
            echo "attempt $attempt of 3"
            if yes | "$SDKMANAGER" "$SPEC" >/dev/null 2>&1; then
              echo "system image installed on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; removing any partial download"
            rm -rf "$ANDROID_HOME/system-images/android-35" 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "system image failed to install after 3 attempts"
          exit 1
      - name: Android WebView and upgrade smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # UPGRADE_APK points at the lower-version APK: the harness installs it
          # first, seeds localStorage, then upgrades to the current
          # app-debug.apk and asserts the seeded data survived the upgrade.
          script: UPGRADE_APK=android/app/build/outputs/apk/debug/old.apk npm run test:android

  deploy-dispatch:
    # Deterministic gates only. android-smoke (a KVM emulator) is the flakiest
    # job in the file, so it reports Android health but does NOT block a
    # production deploy — a stray emulator flake must not stop a copy change.
    #
    # `android` is out for a different reason. It is a ~2.5 minute Gradle build
    # whose only product is an AAB, and nothing here deploys that AAB — the
    # release upload is a manual step against a file on disk. sync-engine rebuilds
    # the app itself before it deploys, so waiting on android delays production
    # without gating anything that reaches users. On run #263 the chain was
    # test -> 19:35:54, android -> 19:38:19, dispatch 19:38:22: ~2.5 minutes of
    # waiting for a job whose result production never sees. `android` still runs,
    # still fails loudly, and still blocks the release — just not this.
    #
    # `browser` IS a gate. Those suites used to be steps inside `test`, so they
    # were already gating the deploy; giving them their own job would have
    # silently dropped that, which is why the dependency is written out.
    needs: [test, usage, browser]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger auto-deploy
        env:
          # Pass the PAT through the environment, not into the run: script text.
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
          # The SHA and run are handed to sync-engine so it can write a commit
          # status back here. Without them a commit shows green the moment the
          # dispatch is posted, whether or not production actually shipped -
          # which is how a failed deploy can look like a healthy one.
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DEPLOY_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"sha\":\"$SHA\",\"run_id\":\"$RUN_ID\"}}" \
            https://api.github.com/repos/Jiansorge/sync-engine/dispatches
