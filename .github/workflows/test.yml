name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build (+ inline CSS)
        run: npm run build
      - name: Built-asset audit (CSP / SW CORE / CSS inlined)
        run: node scripts/audit-build.mjs
      - name: Server integration tests
        run: node scripts/test-server.mjs
      - name: i18n audit
        run: node scripts/audit-i18n.mjs
      - name: Trigger auto-deploy (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"event_type":"deploy"}' \
            https://api.github.com/repos/Jiansorge/sync-engine/dispatches

  usage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install headless Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Real-usage browser suite (CDP, live app + sync server)
        run: node scripts/test-usage-ci.mjs