# Render.com blueprint — one web service runs the whole app: static build + sync socket.
# The client connects to the socket on the same origin, so no extra services needed.
services:
  - type: web
    name: prayer-earth
    runtime: node
    plan: starter # persistent disks aren't available on the free plan
    buildCommand: npm ci && npm run build
    startCommand: node server/index.js
    healthCheckPath: /
    # Persistent disk so all-time prayer totals and the anonymous sync survive
    # redeploys and restarts (Render's default disk is ephemeral).
    disk:
      name: prayer-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: PE_DATA_DIR
        value: /data
      - key: GOOGLE_TTS_KEY
        sync: false # set this in the Render dashboard for authentic neural prayer voices
