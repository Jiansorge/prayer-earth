<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07150d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Joining Palms" />
    <meta name="application-name" content="Joining Palms" />
    <meta
      name="description"
      content="Pray together with the whole world. Choose a sacred prayer from fifteen faiths and traditions, in twelve languages, and watch the Earth glow as the world prays."
    />
    <meta name="robots" content="index, follow" />
    <title>Joining Palms | Pray With the World</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joining Palms" />
    <meta property="og:locale" content="en" />
    <meta property="og:title" content="Joining Palms | Pray With the World" />
    <meta
      property="og:description"
      content="Choose a sacred prayer from fifteen traditions and pray together with the world. Watch the Earth glow as prayer spreads."
    />
    <meta property="og:image" content="/icons/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joining Palms, a glowing globe lit by the world's prayers" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joining Palms | Pray With the World" />
    <meta
      name="twitter:description"
      content="Choose a sacred prayer from fifteen traditions and pray together with the world."
    />
    <meta name="twitter:image" content="/icons/og-card.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Joining Palms",
        "applicationCategory": "LifestyleApplication",
        "description": "Pray together with the whole world, sacred prayers from fifteen faiths and traditions in twelve languages.",
        "inLanguage": ["en", "es", "fr", "de", "hi", "pt", "it", "ru", "zh", "ar", "ja", "ko"],
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and WebGL for the 3D Earth"
      }
    </script>

    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Fill in the canonical/OG URLs once the deployed origin is known. Social
      // scrapers need ABSOLUTE image URLs, so og:image/twitter:image get the
      // origin prefix here too (the static markup keeps them relative for dev).
      try {
        const origin = window.location.origin
        const link = document.createElement('link')
        link.rel = 'canonical'
        link.href = origin + '/'
        document.head.appendChild(link)
        for (const prop of ['og:url']) {
          const m = document.createElement('meta')
          m.setAttribute('property', prop)
          m.setAttribute('content', origin + '/')
          document.head.appendChild(m)
        }
        for (const prop of ['og:image', 'twitter:image']) {
          // og:image uses property=, twitter:image uses name= — match either.
          const existing = document.querySelector(`meta[property="${prop}"], meta[name="${prop}"]`)
          if (existing) existing.setAttribute('content', origin + '/icons/og-card.png')
        }
      } catch {}
    </script>
    <style>
      /* Boot splash: shown the instant the page paints, faded out by React. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 30%, #0e1836, #05070f 72%);
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
      }
      .boot-inner {
        display: grid;
        place-items: center;
        gap: 16px;
      }
      .boot-icon {
        width: 88px;
        height: 88px;
        border-radius: 24px;
        animation: bootGlow 2.4s ease-in-out infinite;
      }
      @keyframes bootGlow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(111, 163, 255, 0.4), 0 0 80px rgba(111, 163, 255, 0.16); }
        50% { transform: scale(1.05); box-shadow: 0 0 48px rgba(111, 163, 255, 0.65), 0 0 110px rgba(111, 163, 255, 0.32); }
      }
      .boot-name {
        color: #dfe9ff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.9;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-icon { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-inner">
        <img class="boot-icon" src="/icons/icon-192.png" alt="" />
        <div class="boot-name">Joining Palms</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
