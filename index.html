    <style>
      /* Boot splash: shown the instant the page paints, faded out by React. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 30%, #0e1836, #05070f 72%);
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
      }
      .boot-inner {
        display: grid;
        place-items: center;
        gap: 16px;
      }
      .boot-icon {
        width: 112px;
        height: 112px;
        border-radius: 28px;
        border: 2px solid rgba(198, 222, 255, 0.5);
        box-shadow: 0 0 0 3px rgba(10, 18, 40, 0.9), 0 0 34px rgba(111, 163, 255, 0.65), 0 0 90px rgba(111, 163, 255, 0.3);
        animation: bootGlow 2.4s ease-in-out infinite;
      }
      @keyframes bootGlow {
        0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(111, 163, 255, 0.4), 0 0 80px rgba(111, 163, 255, 0.16); }
        50% { transform: scale(1.05); box-shadow: 0 0 48px rgba(111, 163, 255, 0.65), 0 0 110px rgba(111, 163, 255, 0.32); }
      }
      .boot-name {
        color: #dfe9ff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0.9;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-icon { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">

        <div class="boot-name">Joining Palms</div>
