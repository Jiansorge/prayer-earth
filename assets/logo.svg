<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Joining Palms">
  <defs>
    <!-- deep velvety cosmic space, indigo toward the top -->
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#241458"/>
      <stop offset="45%" stop-color="#120a34"/>
      <stop offset="100%" stop-color="#060313"/>
    </radialGradient>
    <!-- nebula haze -->
    <radialGradient id="nebA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a7dff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4a7dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a4dff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8a4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#27c3b8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#27c3b8" stop-opacity="0"/>
    </radialGradient>
    <!-- the hands: not flesh, but luminescent sapphire energy -->
    <linearGradient id="hand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4d8bff"/>
      <stop offset="50%" stop-color="#9ccbff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- divine light erupting where the palms touch -->
    <radialGradient id="burst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffe9b0"/>
      <stop offset="70%" stop-color="#9fd0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#9fd0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="spark" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- distant nebulae + astral dust -->
  <ellipse cx="150" cy="120" rx="150" ry="110" fill="url(#nebA)"/>
  <ellipse cx="380" cy="150" rx="140" ry="120" fill="url(#nebB)"/>
  <ellipse cx="300" cy="430" rx="170" ry="90" fill="url(#nebC)"/>

  <!-- sacred geometry: a quiet mandala halo around the joined hands -->
  <g fill="none" stroke="#ffedb0" stroke-width="1.6" opacity="0.28">
    <circle cx="256" cy="330" r="118"/>
    <circle cx="256" cy="330" r="148" stroke-width="1"/>
    <circle cx="256" cy="330" r="178" stroke-width="0.8" stroke-dasharray="3 7"/>
  </g>

  <!-- soft azure radiance behind the hands -->
  <ellipse cx="256" cy="360" rx="150" ry="170" fill="#5aa0ff" opacity="0.32" filter="url(#soft)"/>

  <!-- left hand: wide wrist, four long fingers converging to a point, palms
       pressed together — the prayer gesture, now made of pure light -->
  <g id="handL" fill="url(#hand)">
    <path d="M 132 470 C 130 458, 134 440, 146 414 C 156 392, 166 374, 174 360 C 190 348, 210 348, 224 360 C 234 374, 244 396, 252 420 C 256 436, 258 452, 258 466 C 258 474, 250 478, 238 478 C 206 480, 156 476, 132 470 Z"/>
    <path d="M 156 358 C 148 310, 150 250, 158 218 C 163 202, 173 206, 175 216 C 178 238, 177 300, 176 358 Z"/>
    <path d="M 176 358 C 168 296, 174 230, 186 190 C 192 174, 202 178, 204 188 C 207 214, 204 300, 203 358 Z"/>
    <path d="M 196 358 C 190 286, 196 212, 210 172 C 216 156, 226 160, 228 170 C 231 200, 228 296, 227 358 Z"/>
    <path d="M 216 358 C 212 280, 220 196, 234 154 C 240 138, 250 142, 252 152 C 255 184, 252 292, 251 358 Z"/>
    <path d="M 140 392 C 134 410, 132 428, 136 442 C 141 452, 152 450, 154 438 C 157 424, 154 406, 150 396 C 147 388, 143 387, 140 392 Z"/>
  </g>
  <use href="#handL" transform="translate(512 0) scale(-1 1)"/>

  <!-- divine light bursting from the point where the palms touch -->
  <circle cx="256" cy="330" r="140" fill="url(#burst)"/>
  <circle cx="256" cy="330" r="28" fill="#ffffff"/>
  <circle cx="256" cy="330" r="50" fill="#fff6d8" opacity="0.85" filter="url(#glow)"/>
  <g fill="none" stroke="#fff7dd" stroke-width="2.4" opacity="0.9" filter="url(#glow)">
    <path d="M 256 300 C 252 278, 250 260, 256 238" stroke-linecap="round"/>
    <path d="M 256 300 C 260 278, 262 260, 256 238" stroke-linecap="round"/>
    <path d="M 220 318 C 240 312, 250 308, 256 306" stroke-linecap="round"/>
    <path d="M 292 318 C 272 312, 262 308, 256 306" stroke-linecap="round"/>
  </g>
  <!-- radiant star at the touch -->
  <path d="M 256 280 l 7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7 Z" fill="#ffffff" filter="url(#glow)"/>

  <!-- light ribbons radiating upward (fractal divine energy) -->
  <g stroke="url(#hand)" stroke-width="5" stroke-linecap="round" opacity="0.8" filter="url(#glow)">
    <path d="M 256 236 C 240 196, 238 168, 250 132"/>
    <path d="M 256 236 C 272 196, 274 168, 262 132"/>
  </g>
  <g stroke="#cfe6ff" stroke-width="3" stroke-linecap="round" opacity="0.65" filter="url(#glow)">
    <path d="M 256 240 C 222 210, 204 190, 196 156"/>
    <path d="M 256 240 C 290 210, 308 190, 316 156"/>
  </g>

  <!-- galaxies + stardust swirling in the palms -->
  <g fill="#eaf4ff" filter="url(#glow)">
    <circle cx="238" cy="318" r="2.6"/>
    <circle cx="246" cy="312" r="1.8"/>
    <circle cx="230" cy="326" r="1.6"/>
    <circle cx="274" cy="318" r="2.6"/>
    <circle cx="266" cy="312" r="1.8"/>
    <circle cx="282" cy="326" r="1.6"/>
  </g>
  <g fill="#9cc9ff">
    <circle cx="228" cy="344" r="1.5"/>
    <circle cx="284" cy="344" r="1.5"/>
    <circle cx="256" cy="356" r="1.5"/>
  </g>

  <!-- rising motes across the void -->
  <g fill="#eaf4ff">
    <circle cx="200" cy="116" r="5"/>
    <circle cx="256" cy="82" r="6"/>
    <circle cx="318" cy="108" r="4.5"/>
    <circle cx="230" cy="150" r="3.2"/>
    <circle cx="292" cy="134" r="3.8"/>
    <circle cx="180" cy="178" r="2.8"/>
    <circle cx="340" cy="166" r="3.2"/>
    <circle cx="272" cy="104" r="2.4"/>
    <circle cx="352" cy="230" r="2.6"/>
    <circle cx="162" cy="238" r="2.6"/>
    <circle cx="216" cy="200" r="2.2"/>
    <circle cx="300" cy="192" r="2.2"/>
    <circle cx="246" cy="240" r="2.0"/>
    <circle cx="270" cy="236" r="1.8"/>
    <circle cx="196" cy="262" r="1.8"/>
    <circle cx="322" cy="254" r="1.8"/>
  </g>

  <!-- sparkles bursting from the hands -->
  <g fill="#ffffff" filter="url(#spark)">
    <path d="M 256 92 l 4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 Z"/>
    <path d="M 204 146 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <path d="M 308 142 l 3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 Z"/>
    <path d="M 238 250 l 2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z"/>
    <path d="M 274 244 l 2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 6 -2.4 Z"/>
    <circle cx="236" cy="120" r="2.6"/>
    <circle cx="284" cy="124" r="2.4"/>
    <circle cx="208" cy="206" r="2.2"/>
    <circle cx="304" cy="200" r="2.2"/>
  </g>
</svg>
