<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Joining Palms">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#0a1535"/>
      <stop offset="40%" stop-color="#070f28"/>
      <stop offset="100%" stop-color="#03071a"/>
    </radialGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0f3dff"/>
      <stop offset="25%" stop-color="#2a6bff"/>
      <stop offset="55%" stop-color="#5aa8ff"/>
      <stop offset="85%" stop-color="#9fd0ff"/>
      <stop offset="100%" stop-color="#e0f0ff"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#a8d8ff"/>
      <stop offset="70%" stop-color="#4d8bff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a4dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="intense" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stars - denser, like webp's starfield -->
  <g fill="#eaf4ff" opacity="0.95">
    <circle cx="70" cy="30" r="1.1"/><circle cx="110" cy="55" r="0.9"/><circle cx="150" cy="25" r="1"/><circle cx="190" cy="45" r="1.4"/><circle cx="230" cy="35" r="1.8"/><circle cx="270" cy="28" r="2.1"/><circle cx="310" cy="45" r="1.3"/><circle cx="350" cy="30" r="1"/><circle cx="390" cy="55" r="1"/><circle cx="430" cy="25" r="1.2"/><circle cx="470" cy="40" r="0.9"/>
    <circle cx="50" cy="90" r="1"/><circle cx="95" cy="115" r="0.8"/><circle cx="140" cy="85" r="1"/><circle cx="180" cy="110" r="1.2"/><circle cx="220" cy="95" r="0.9"/><circle cx="300" cy="110" r="1.1"/><circle cx="340" cy="85" r="0.9"/><circle cx="380" cy="115" r="1"/><circle cx="420" cy="90" r="1"/><circle cx="460" cy="125" r="0.8"/>
    <circle cx="35" cy="170" r="0.9"/><circle cx="80" cy="190" r="1"/><circle cx="130" cy="160" r="0.8"/><circle cx="170" cy="185" r="1"/><circle cx="350" cy="170" r="1.1"/><circle cx="390" cy="190" r="0.9"/><circle cx="430" cy="160" r="1"/><circle cx="470" cy="200" r="0.9"/>
    <circle cx="45" cy="250" r="0.8"/><circle cx="85" cy="270" r="1"/><circle cx="125" cy="240" r="0.9"/><circle cx="370" cy="250" r="1"/><circle cx="410" cy="270" r="0.9"/><circle cx="450" cy="240" r="1.1"/><circle cx="480" cy="280" r="0.8"/>
    <circle cx="40" cy="320" r="0.9"/><circle cx="75" cy="340" r="1"/><circle cx="115" cy="310" r="0.8"/><circle cx="390" cy="320" r="1"/><circle cx="430" cy="340" r="0.9"/><circle cx="470" cy="310" r="0.8"/>
    <circle cx="60" cy="380" r="1"/><circle cx="95" cy="410" r="0.9"/><circle cx="400" cy="380" r="1"/><circle cx="440" cy="410" r="0.8"/><circle cx="480" cy="360" r="0.9"/>
  </g>
  <!-- hands - refined to match webp: slender fingers together in prayer, translucent -->
  <g fill="url(#hand)" filter="url(#glow)" opacity="0.92">
    <!-- left hand - palm and wrist -->
    <path d="M 188 482 C 186 462, 190 438, 202 412 C 212 386, 222 365, 230 345 C 238 330, 252 328, 260 345 C 268 360, 272 380, 274 405 C 275 428, 274 452, 272 468 C 270 474, 262 476, 252 476 C 222 477, 195 473, 188 482 Z"/>
    <!-- fingers together, slender, tips touching -->
    <path d="M 215 345 C 212 310, 214 265, 220 235 C 222 222, 229 224, 231 232 C 233 255, 230 305, 229 345 Z"/>
    <path d="M 229 345 C 226 300, 230 250, 238 220 C 241 210, 248 212, 250 220 C 252 240, 249 300, 248 345 Z"/>
    <path d="M 243 345 C 241 292, 246 240, 255 210 C 258 200, 265 202, 267 210 C 270 230, 267 292, 266 345 Z"/>
    <path d="M 257 345 C 255 285, 260 225, 270 195 C 273 185, 280 188, 282 196 C 285 214, 282 285, 281 345 Z"/>
    <path d="M 192 385 C 190 402, 190 422, 194 436 C 197 443, 204 441, 206 432 C 208 418, 204 398, 200 388 C 197 381, 193 380, 192 385 Z"/>
  </g>
  <!-- right hand - mirrored, fingers together, translucent -->
  <g fill="url(#hand)" filter="url(#glow)" opacity="0.92">
    <path d="M 324 482 C 326 462, 322 438, 310 412 C 300 386, 290 365, 282 345 C 274 330, 260 328, 252 345 C 244 360, 240 380, 238 405 C 237 428, 238 452, 240 468 C 242 474, 250 476, 260 476 C 290 477, 317 473, 324 482 Z"/>
    <path d="M 297 345 C 300 310, 298 265, 292 235 C 290 222, 283 224, 281 232 C 279 255, 282 305, 283 345 Z"/>
    <path d="M 283 345 C 286 300, 282 250, 274 220 C 271 210, 264 212, 262 220 C 260 240, 263 300, 264 345 Z"/>
    <path d="M 269 345 C 271 292, 266 240, 257 210 C 254 200, 247 202, 245 210 C 242 230, 245 292, 246 345 Z"/>
    <path d="M 255 345 C 257 285, 252 225, 242 195 C 239 185, 232 188, 230 196 C 227 214, 230 285, 231 345 Z"/>
    <path d="M 320 385 C 322 402, 322 422, 318 436 C 315 443, 308 441, 306 432 C 304 418, 308 398, 312 388 C 315 381, 319 380, 320 385 Z"/>
  </g>
  <!-- central light - intense, between fingertips like webp -->
  <ellipse cx="256" cy="290" rx="50" ry="40" fill="url(#light)" opacity="0.96"/>
  <ellipse cx="256" cy="286" rx="30" ry="24" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="282" r="16" fill="#ffffff" opacity="1"/>
  <ellipse cx="256" cy="285" rx="60" ry="45" fill="url(#light)" opacity="0.4" filter="url(#soft)"/>
  <!-- sparkles - more dense, like webp's starry hands -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="256" cy="175" r="2.8"/><circle cx="245" cy="195" r="1.6"/><circle cx="267" cy="195" r="1.6"/><circle cx="235" cy="215" r="1.3"/><circle cx="277" cy="215" r="1.3"/>
    <circle cx="250" cy="235" r="1.1"/><circle cx="262" cy="235" r="1.1"/><circle cx="228" cy="250" r="1"/><circle cx="284" cy="250" r="1"/><circle cx="238" cy="265" r="0.9"/><circle cx="274" cy="265" r="0.9"/>
    <circle cx="245" cy="285" r="0.8"/><circle cx="267" cy="285" r="0.8"/><circle cx="230" cy="295" r="0.7"/><circle cx="282" cy="295" r="0.7"/>
  </g>
  <g fill="#a8d8ff" opacity="0.8">
    <circle cx="218" cy="310" r="0.9"/><circle cx="294" cy="310" r="0.9"/><circle cx="225" cy="330" r="0.8"/><circle cx="287" cy="330" r="0.8"/><circle cx="235" cy="350" r="0.7"/><circle cx="277" cy="350" r="0.7"/>
  </g>
  <!-- hand particles - like webp's speckled hands -->
  <g fill="#ffffff" opacity="0.85" filter="url(#intense)">
    <circle cx="215" cy="380" r="0.7"/><circle cx="220" cy="400" r="0.9"/><circle cx="225" cy="420" r="0.8"/><circle cx="230" cy="440" r="0.6"/><circle cx="235" cy="360" r="0.7"/><circle cx="240" cy="380" r="0.6"/>
    <circle cx="297" cy="380" r="0.7"/><circle cx="292" cy="400" r="0.9"/><circle cx="287" cy="420" r="0.8"/><circle cx="282" cy="440" r="0.6"/><circle cx="277" cy="360" r="0.7"/><circle cx="272" cy="380" r="0.6"/>
    <circle cx="250" cy="390" r="0.5"/><circle cx="262" cy="390" r="0.5"/><circle cx="245" cy="410" r="0.6"/><circle cx="267" cy="410" r="0.6"/>
  </g>
</svg>