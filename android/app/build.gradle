apply plugin: 'com.android.application'

// Release signing: reads android/key.properties (gitignored) when present, so
// release AABs are upload-key signed locally. CI/web builds never need it.
def keystorePropsFile = rootProject.file('key.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// A release build with no signing config produces a bundle that builds cleanly
// and then fails at Play upload, hours later, which is the worst time to find
// out. Gradle will also happily assemble `assembleDebug` in between, which reads
// nothing here. So: refuse at configuration time, and say exactly what to do.
//
// Skip the check when only a debug variant is wanted, so a developer without
// the upload key can still run `assembleDebug` and the emulator smoke test.
def gradleTaskNames = gradle.startParameter.taskNames as List<String>
def wantsRelease = gradleTaskNames.any { it.toLowerCase().contains('release') }
if (wantsRelease && !keystorePropsFile.exists()) {
    throw new GradleException(
        "\n" +
        "Refusing to build a release: android/key.properties is missing.\n" +
        "\n" +
        "Without it the bundle would be unsigned and Play would reject it.\n" +
        "Create it (see RELEASE.md section 2):\n" +
        "\n" +
        "  storeFile=/absolute/path/to/release.keystore\n" +
        "  storePassword=...\n" +
        "  keyAlias=joining-palms\n" +
        "  keyPassword=...\n" +
        "\n" +
        "To build a debug APK without the upload key, run assembleDebug instead.\n"
    )
}
// The file can exist but still be wrong - a relative path, or a keystore that
// has moved. Catching that here names the real problem instead of letting
// Gradle fail deep inside the signing task.
if (wantsRelease) {
    for (def required : ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']) {
        if (!keystoreProps[required]) {
            throw new GradleException(
                "\nandroid/key.properties is missing the '${required}' entry.\n" +
                "It needs all four: storeFile, storePassword, keyAlias, keyPassword.\n"
            )
        }
    }
    def store = file(keystoreProps['storeFile'])
    if (!store.exists()) {
        throw new GradleException(
            "\nandroid/key.properties points storeFile at a file that does not exist:\n" +
            "  ${keystoreProps['storeFile']}\n" +
            "Use an absolute path to the .keystore file itself.\n"
        )
    }
}

android {
    namespace = "app.joiningpalms"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.joiningpalms"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
// 26: self-service deletion (in-app button + the hashed-token endpoint) and
    // opt-in presence sharing, which did not exist in the uploaded 25.
    // 28: the picker keeps your place in a tradition, its favourites strip fits
    // inside the sheet, and the home grid no longer returns half-blank.
    versionCode 31
    versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // The phone already carries an app signed with the upload key, so
            // the default debug keystore cannot update it
            // (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and an uninstall would take
            // the reader's prayer counts with it. Sign device-test debug builds
            // with the release key when this machine has it; a fresh clone
            // without key.properties keeps the default debug keystore.
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Installs baseline profiles (startup + recorded hot paths) so the ART
    // ahead-of-time compiles them. Ships as a no-op until a profile is bundled
    // (src/main/baseline-prof.txt, recorded by :benchmark - docs/PERFORMANCE.md).
    implementation "androidx.profileinstaller:profileinstaller:$androidxProfileinstallerVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Gradle packages whatever is sitting in android/app/src/main/assets/public and
// has no idea that `npx cap sync android` is what puts it there. Skip that step
// and the build reports BUILD SUCCESSFUL while shipping an older web app, which
// is not hypothetical: a green Gradle run packaged web assets two days old, and
// the only reason it was noticed was opening the APK and comparing a chunk hash.
// Every other signal agreed with the build - the merged manifest was right, the
// app installed, it launched.
//
// So the staleness check runs inside the build rather than beside it. If the
// packaged web app is not the web app in dist/, no APK is produced at all, and
// the reason is printed instead of being summarised as BUILD SUCCESSFUL.
def webAssetsSyncScript = file("${rootProject.projectDir.parentFile}/scripts/check-android-sync.mjs")

tasks.register('checkWebAssetsInSync', Exec) {
    group = 'verification'
    description = 'Refuse to package a web app that is not the one in dist/.'
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', webAssetsSyncScript.absolutePath
    doFirst {
        def exe = System.getProperty('os.name').toLowerCase().contains('windows') ? 'node.exe' : 'node'
        def onPath = (System.getenv('PATH') ?: '')
            .split(File.pathSeparator)
            .any { new File(it as String, exe).exists() }
        if (!onPath) {
            throw new GradleException(
                "\nCannot verify that the packaged web assets are current: `node` is not on PATH.\n" +
                "This build refuses to package assets that might be stale, which is how two-day-old\n" +
                "web code shipped inside a successful Gradle build.\n" +
                "Either put node on PATH, or run the check yourself:\n" +
                "  node ${webAssetsSyncScript.absolutePath}\n"
            )
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'checkWebAssetsInSync'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
