apply plugin: 'com.android.application'

// Release signing: reads android/key.properties (gitignored) when present, so
// release AABs are upload-key signed locally. CI/web builds never need it.
def keystorePropsFile = rootProject.file('key.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// A release build with no signing config produces a bundle that builds cleanly
// and then fails at Play upload, hours later, which is the worst time to find
// out. Gradle will also happily assemble `assembleDebug` in between, which reads
// nothing here. So: refuse at configuration time, and say exactly what to do.
//
// Skip the check when only a debug variant is wanted, so a developer without
// the upload key can still run `assembleDebug` and the emulator smoke test.
def gradleTaskNames = gradle.startParameter.taskNames as List<String>
def wantsRelease = gradleTaskNames.any { it.toLowerCase().contains('release') }
if (wantsRelease && !keystorePropsFile.exists()) {
    throw new GradleException(
        "\n" +
        "Refusing to build a release: android/key.properties is missing.\n" +
        "\n" +
        "Without it the bundle would be unsigned and Play would reject it.\n" +
        "Create it (see RELEASE.md section 2):\n" +
        "\n" +
        "  storeFile=/absolute/path/to/release.keystore\n" +
        "  storePassword=...\n" +
        "  keyAlias=joining-palms\n" +
        "  keyPassword=...\n" +
        "\n" +
        "To build a debug APK without the upload key, run assembleDebug instead.\n"
    )
}
// The file can exist but still be wrong - a relative path, or a keystore that
// has moved. Catching that here names the real problem instead of letting
// Gradle fail deep inside the signing task.
if (wantsRelease) {
    for (def required : ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']) {
        if (!keystoreProps[required]) {
            throw new GradleException(
                "\nandroid/key.properties is missing the '${required}' entry.\n" +
                "It needs all four: storeFile, storePassword, keyAlias, keyPassword.\n"
            )
        }
    }
    def store = file(keystoreProps['storeFile'])
    if (!store.exists()) {
        throw new GradleException(
            "\nandroid/key.properties points storeFile at a file that does not exist:\n" +
            "  ${keystoreProps['storeFile']}\n" +
            "Use an absolute path to the .keystore file itself.\n"
        )
    }
}

android {
    namespace = "app.joiningpalms"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.joiningpalms"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
// 26: self-service deletion (in-app button + the hashed-token endpoint) and
    // opt-in presence sharing, which did not exist in the uploaded 25.
    versionCode 27
    versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
